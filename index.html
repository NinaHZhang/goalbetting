<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoalBet App</title>
    <style>
      .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 1000;
      }
      .modal-content {
        background: #fff; padding: 2rem; border-radius: 12px; min-width: 400px; position: relative;
      }
      .modal-close {
        position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer;
      }
      .modal-row { display: flex; gap: 1rem; }
      .modal-actions { display: flex; gap: 1rem; margin-top: 1rem; }
      .primary { background: #000; color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <input type="date" />
  </body>
</html>
